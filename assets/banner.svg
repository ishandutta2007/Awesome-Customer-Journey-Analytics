<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
          filter: drop-shadow(0 0 12px #38bdf8);
        }
      }
      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .animated-path {
        stroke-dasharray: 12, 12;
        animation: dash 30s linear infinite;
      }
      .pulse-node {
        transform-origin: center;
        animation: pulse 3s ease-in-out infinite;
      }
      .node-2 {
        animation-delay: 0.6s;
      }
      .node-3 {
        animation-delay: 1.2s;
      }
      .node-4 {
        animation-delay: 1.8s;
      }
      .node-5 {
        animation-delay: 2.4s;
      }
      .floating-card {
        animation: float 5s ease-in-out infinite;
      }
      .float-offset-1 {
        animation-delay: -1.5s;
      }
      .float-offset-2 {
        animation-delay: -3s;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="320" r="130" fill="#f43f5e" opacity="0.06" filter="url(#glow)" />

  <!-- Animated Customer Journey Wave Flow Line -->
  <g opacity="0.85">
    <!-- Glow Path Underneath -->
    <path d="M 60,300 C 220,180 340,340 520,240 C 700,140 840,300 1020,190 C 1100,140 1140,160 1160,170" 
          fill="none" stroke="url(#glow-grad)" stroke-width="8" filter="url(#glow)" opacity="0.4" />
    <!-- Main Gradient Path -->
    <path d="M 60,300 C 220,180 340,340 520,240 C 700,140 840,300 1020,190 C 1100,140 1140,160 1160,170" 
          fill="none" stroke="url(#primary-grad)" stroke-width="3.5" />
    <!-- Animated Dashed Flow Line -->
    <path d="M 60,300 C 220,180 340,340 520,240 C 700,140 840,300 1020,190 C 1100,140 1140,160 1160,170" 
          class="animated-path" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Journey Milestone Nodes -->
  <!-- Node 1: Touchpoint Discovery -->
  <g class="pulse-node">
    <circle cx="60" cy="300" r="10" fill="#090d16" stroke="#38bdf8" stroke-width="3" />
    <circle cx="60" cy="300" r="4" fill="#38bdf8" />
  </g>
  <text x="60" y="328" text-anchor="middle" fill="#94a3b8" class="badge-text">Discovery</text>

  <!-- Node 2: Web / App Engagement -->
  <g class="pulse-node node-2">
    <circle cx="280" cy="242" r="10" fill="#090d16" stroke="#60a5fa" stroke-width="3" />
    <circle cx="280" cy="242" r="4" fill="#60a5fa" />
  </g>
  <text x="280" y="270" text-anchor="middle" fill="#94a3b8" class="badge-text">Events &amp; Replay</text>

  <!-- Node 3: Funnel &amp; Path Analysis -->
  <g class="pulse-node node-3">
    <circle cx="520" cy="240" r="11" fill="#090d16" stroke="#a855f7" stroke-width="3" />
    <circle cx="520" cy="240" r="5" fill="#c084fc" />
  </g>
  <text x="520" y="215" text-anchor="middle" fill="#c084fc" class="badge-text">Funnels &amp; Paths</text>

  <!-- Node 4: Identity &amp; Cohorts -->
  <g class="pulse-node node-4">
    <circle cx="780" cy="210" r="10" fill="#090d16" stroke="#ec4899" stroke-width="3" />
    <circle cx="780" cy="210" r="4" fill="#ec4899" />
  </g>
  <text x="780" y="185" text-anchor="middle" fill="#f472b6" class="badge-text">Identity &amp; CDP</text>

  <!-- Node 5: Conversion &amp; Retention -->
  <g class="pulse-node node-5">
    <circle cx="1020" cy="190" r="12" fill="#090d16" stroke="#f43f5e" stroke-width="3" />
    <circle cx="1020" cy="190" r="5" fill="#f43f5e" />
  </g>
  <text x="1020" y="222" text-anchor="middle" fill="#fb7185" class="badge-text">Conversion &amp; LTV</text>

  <!-- Floating Feature Badges (Top Right) -->
  <g class="floating-card float-offset-1" opacity="0.95">
    <rect x="940" y="32" width="200" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="958" cy="49" r="6" fill="#10b981" />
    <text x="972" y="53" fill="#e2e8f0" class="badge-text">100% Curated Stack</text>
  </g>

  <g class="floating-card float-offset-2" opacity="0.95">
    <rect x="740" y="32" width="185" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="758" cy="49" r="6" fill="#38bdf8" />
    <text x="772" y="53" fill="#e2e8f0" class="badge-text">SaaS &amp; Open-Source</text>
  </g>

  <!-- Main Banner Header Content -->
  <g transform="translate(60, 50)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="290" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="145" y="17" text-anchor="middle" fill="#a5b4fc" class="badge-text">🌟 AWESOME CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#primary-grad)" class="title-text" font-size="38" filter="url(#soft-glow)">
      Customer Journey Analytics
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="102" fill="#cbd5e1" class="sub-text" font-size="15">
      The ultimate guide to SaaS platforms, open-source stacks, event collection, session replay &amp; behavioral insights
    </text>
  </g>

  <!-- Bottom Interactive Tags / Pills -->
  <g transform="translate(60, 335)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="75" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">⚡ Product Analytics</text>

    <!-- Tag 2 -->
    <rect x="160" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="230" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">🎥 Session Replay</text>

    <!-- Tag 3 -->
    <rect x="310" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="382" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">📊 Event Pipelines</text>

    <!-- Tag 4 -->
    <rect x="465" y="0" width="155" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="542" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">🛣️ Journey Mapping</text>

    <!-- Tag 5 -->
    <rect x="630" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="700" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">🧪 Experimentation</text>

    <!-- Tag 6 -->
    <rect x="780" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="852" y="17" text-anchor="middle" fill="#94a3b8" class="badge-text">🔒 Privacy-First BI</text>
  </g>

  <!-- Border Accent Glow -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.35" />
</svg>
